services:
  citas-medicas-api:
    image: citas-medicas-api:local
    build:
      context: ./citas-medicas-api
      dockerfile: ../Dockerfile
    container_name: citas-medicas-api
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      SERVER_PORT: "8080"
      SERVER_SERVLET_CONTEXT_PATH: /api/v1
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@//${ORACLE_HOST:-host.docker.internal}:${ORACLE_PORT:-1521}/${ORACLE_SERVICE:-XEPDB1}
      SPRING_DATASOURCE_USERNAME: "${ORACLE_USERNAME:-app_citas}"
      SPRING_DATASOURCE_PASSWORD: "${ORACLE_PASSWORD:-Citas2024#}"
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      APP_JWT_SECRET: "${JWT_SECRET:-5d8f3a1b7e2c9f4a6d0e8b2c5f9a3d7e1b4c8f2a6d0e3b7c5f9a2d6e1b4c8f2}"
      APP_CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:4200,http://localhost:5173,http://localhost:5174}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
